spring:
  application:
    name: mspedidos
  datasource:
    url: jdbc:h2:mem:pedido
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

server:
  port: 8082

clients:
  estoque-service:
    url: http://localhost:8081
  pagamento-service:
    url: http://localhost:8083
