spring:
  application:
    name: mspagamento
  datasource:
    url: jdbc:h2:mem:pagamento
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2 # uma tentativa inicial e duas novas tentativas
          initial-interval: 1s
          multiplier: 2
          max-interval: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8083

payment:
  gateway:
    simulate-timeout: false
