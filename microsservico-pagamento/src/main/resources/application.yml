spring:
  application:
    name: mspagamento
  datasource:
    url: jdbc:h2:mem:pagamento
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8083