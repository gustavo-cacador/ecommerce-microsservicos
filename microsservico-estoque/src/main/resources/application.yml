spring:
  application:
    name: msestoque
  datasource:
    url: jdbc:h2:mem:estoque
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2 # uma tentativa inicial e duas novas tentativas
          initial-interval: 1s
          multiplier: 2
          max-interval: 2s
server:
  port: 8081
